<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spend Their Money 🧀CX - 200+ Items & Creator Mega Edition</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        cheese: {
                            100: '#FFFBEB',
                            300: '#FDE047',
                            400: '#FACC15',
                            500: '#EAB308',
                            600: '#CA8A04',
                            700: '#A16207'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom scrollbar & glassmorphism styling */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #eab308; }
        .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans relative overflow-x-hidden">

    <!-- Celebration Canvas Overlay -->
    <canvas id="confetti-canvas" class="fixed inset-0 pointer-events-none z-50"></canvas>

    <!-- STICKY HEADER -->
    <header class="sticky top-0 z-40 glass-panel border-b border-slate-800 shadow-2xl">
        <div class="max-w-7xl mx-auto px-4 py-3">
            
            <!-- Top Controls & Character Selector -->
            <div class="flex flex-wrap justify-between items-center gap-3 mb-3">
                <div class="flex items-center gap-3">
                    <div id="guy-avatar-wrapper" class="w-12 h-12 rounded-full bg-slate-800 border-2 border-cheese-400 flex items-center justify-center text-2xl overflow-hidden shadow-lg">
                        <span id="guy-emoji">👨‍💼</span>
                    </div>
                    <div>
                        <div class="flex items-center gap-2">
                            <label for="guy-select" class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Target Guy:</label>
                            <select id="guy-select" onchange="switchGuy(this.value)" class="bg-slate-800 border border-slate-700 text-cheese-400 text-sm font-bold rounded-lg px-2 py-1 focus:ring-2 focus:ring-cheese-400 outline-none cursor-pointer">
                                <!-- Options populated by JS -->
                            </select>
                        </div>
                        <p id="guy-tagline" class="text-xs text-slate-400 italic mt-0.5">"I have more cash than I know what to do with!"</p>
                    </div>
                </div>

                <div class="flex items-center gap-2 flex-wrap">
                    <button onclick="openCustomGuyModal()" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-lg text-xs transition shadow-md flex items-center gap-1">
                        ➕ Create Custom Guy
                    </button>
                    <button onclick="openCustomItemModal()" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-lg text-xs transition shadow-md flex items-center gap-1">
                        🧀 Add Custom Item
                    </button>
                    <button onclick="openReceiptModal()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-cheese-400 border border-cheese-500/30 font-bold rounded-lg text-xs transition shadow-md flex items-center gap-1">
                        📜 View Receipt (<span id="cart-count">0</span>)
                    </button>
                    <button onclick="resetGame()" class="px-3 py-1.5 bg-rose-950/80 hover:bg-rose-900 border border-rose-800 text-rose-300 font-bold rounded-lg text-xs transition">
                        🔄 Reset All
                    </button>
                </div>
            </div>

            <!-- Sticky Balance Counter -->
            <div class="bg-gradient-to-r from-emerald-950/80 via-slate-900 to-emerald-950/80 border border-emerald-500/30 rounded-2xl p-4 text-center shadow-inner relative overflow-hidden">
                <div class="text-xs font-semibold uppercase tracking-widest text-emerald-400 mb-1">Remaining Wealth</div>
                <div id="balance-display" class="text-3xl md:text-5xl font-black text-cheese-300 tracking-tight font-mono drop-shadow-[0_2px_10px_rgba(234,179,8,0.3)]">
                    100,000,000,000 🧀CX
                </div>

                <!-- Spending Progress Bar -->
                <div class="mt-3 w-full bg-slate-950 rounded-full h-3.5 border border-slate-800 p-0.5 relative overflow-hidden">
                    <div id="progress-bar" class="bg-gradient-to-r from-cheese-500 via-amber-400 to-emerald-400 h-full rounded-full transition-all duration-300" style="width: 0%"></div>
                </div>
                <div class="flex justify-between text-[10px] text-slate-400 font-mono mt-1 px-1">
                    <span>Spent: <span id="spent-display" class="text-slate-200">0 🧀CX</span></span>
                    <span>Liquidated: <span id="percent-display" class="text-cheese-400 font-bold">0.00%</span></span>
                </div>
            </div>

            <!-- Multiplier & Search Controls Bar -->
            <div class="flex flex-wrap justify-between items-center gap-3 mt-3 pt-2 border-t border-slate-800/80">
                <!-- Multipliers -->
                <div class="flex items-center gap-1">
                    <span class="text-xs font-bold text-slate-400 mr-1">BUY QTY:</span>
                    <button onclick="setMultiplier(1)" id="mult-1" class="mult-btn px-2.5 py-1 text-xs font-extrabold rounded-md border border-cheese-400 bg-cheese-400 text-slate-950">x1</button>
                    <button onclick="setMultiplier(10)" id="mult-10" class="mult-btn px-2.5 py-1 text-xs font-extrabold rounded-md border border-slate-700 bg-slate-800 text-slate-300 hover:border-slate-500">x10</button>
                    <button onclick="setMultiplier(100)" id="mult-100" class="mult-btn px-2.5 py-1 text-xs font-extrabold rounded-md border border-slate-700 bg-slate-800 text-slate-300 hover:border-slate-500">x100</button>
                    <button onclick="setMultiplier(1000)" id="mult-1000" class="mult-btn px-2.5 py-1 text-xs font-extrabold rounded-md border border-slate-700 bg-slate-800 text-slate-300 hover:border-slate-500">x1000</button>
                    <button onclick="setMultiplier('MAX')" id="mult-MAX" class="mult-btn px-2.5 py-1 text-xs font-extrabold rounded-md border border-slate-700 bg-slate-800 text-slate-300 hover:border-slate-500">MAX</button>
                </div>

                <!-- Search & Filters -->
                <div class="flex items-center gap-2 flex-grow max-w-md">
                    <input type="text" id="search-input" oninput="renderItems()" placeholder="🔍 Search 200+ items..." class="w-full bg-slate-900 border border-slate-700 text-xs rounded-lg px-3 py-1.5 text-slate-200 placeholder-slate-500 focus:ring-1 focus:ring-cheese-400 outline-none">
                    <select id="category-select" onchange="renderItems()" class="bg-slate-900 border border-slate-700 text-xs text-slate-300 rounded-lg px-2 py-1.5 outline-none cursor-pointer">
                        <option value="ALL">All Categories</option>
                        <option value="Cheese">🧀 Cheese & Food</option>
                        <option value="Gaming">🎮 Gaming & Tech</option>
                        <option value="Vehicles">🚀 Vehicles & Flex</option>
                        <option value="Estates">🏰 Real Estate & Land</option>
                        <option value="Cosmic">🌌 Cosmic & Sci-Fi</option>
                        <option value="Custom">✨ Custom Items</option>
                    </select>
                </div>
            </div>

        </div>
    </header>

    <!-- MAIN ITEMS GRID -->
    <main class="max-w-7xl mx-auto px-4 py-8">
        <div id="items-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
            <!-- Items rendered dynamically by JS -->
        </div>
    </main>

    <!-- CUSTOM GUY MODAL -->
    <div id="custom-guy-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
        <div class="glass-panel border border-slate-700 rounded-2xl p-6 max-w-md w-full shadow-2xl">
            <h3 class="text-xl font-black text-cheese-400 mb-4 flex items-center gap-2">
                <span>👨‍💼</span> Create Custom Rich Guy
            </h3>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Guy Name</label>
                    <input type="text" id="guy-name-input" placeholder="e.g. Cheese Baron Ultra" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-slate-100 outline-none focus:border-cheese-400">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Avatar Emoji or Image URL</label>
                    <input type="text" id="guy-avatar-input" placeholder="e.g. 👑 or https://..." class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-slate-100 outline-none focus:border-cheese-400">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Net Worth (🧀CX)</label>
                    <input type="number" id="guy-worth-input" placeholder="100000000000" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-slate-100 outline-none focus:border-cheese-400">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Catchphrase / Tagline</label>
                    <input type="text" id="guy-tagline-input" placeholder="e.g. Extra sharp wealth!" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-slate-100 outline-none focus:border-cheese-400">
                </div>
            </div>
            <div class="flex justify-end gap-2 mt-6">
                <button onclick="closeCustomGuyModal()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-xs font-bold">Cancel</button>
                <button onclick="saveCustomGuy()" class="px-4 py-2 bg-cheese-500 hover:bg-cheese-400 text-slate-950 rounded-lg text-xs font-extrabold">Create Character</button>
            </div>
        </div>
    </div>

    <!-- CUSTOM ITEM MODAL -->
    <div id="custom-item-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
        <div class="glass-panel border border-slate-700 rounded-2xl p-6 max-w-md w-full shadow-2xl">
            <h3 class="text-xl font-black text-emerald-400 mb-4 flex items-center gap-2">
                <span>🧀</span> Add Custom Purchasable Item
            </h3>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Item Name</label>
                    <input type="text" id="item-name-input" placeholder="e.g. Golden Cheese Wheel Fortress" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-slate-100 outline-none focus:border-emerald-400">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Price (🧀CX)</label>
                    <input type="number" id="item-price-input" placeholder="500000" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-slate-100 outline-none focus:border-emerald-400">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Icon / Emoji</label>
                    <input type="text" id="item-icon-input" placeholder="🧀" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-slate-100 outline-none focus:border-emerald-400">
                </div>
            </div>
            <div class="flex justify-end gap-2 mt-6">
                <button onclick="closeCustomItemModal()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-xs font-bold">Cancel</button>
                <button onclick="saveCustomItem()" class="px-4 py-2 bg-emerald-500 hover:bg-emerald-400 text-slate-950 rounded-lg text-xs font-extrabold">Add To Catalog</button>
            </div>
        </div>
    </div>

    <!-- RECEIPT MODAL -->
    <div id="receipt-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
        <div class="glass-panel border border-slate-700 rounded-2xl p-6 max-w-lg w-full max-h-[85vh] flex flex-col shadow-2xl">
            <div class="flex justify-between items-center mb-4 border-b border-slate-800 pb-3">
                <h3 class="text-xl font-black text-cheese-400 flex items-center gap-2">
                    <span>📜</span> Official Receipt & Audit
                </h3>
                <button onclick="closeReceiptModal()" class="text-slate-400 hover:text-white text-lg font-bold">&times;</button>
            </div>

            <div id="receipt-content" class="overflow-y-auto flex-grow pr-2 font-mono text-xs space-y-2 text-slate-300 border-b border-slate-800 pb-4">
                <!-- Receipt rows injected here -->
            </div>

            <div class="pt-4 flex justify-between items-center">
                <div class="text-xs text-slate-400">Total Spent: <span id="receipt-total" class="text-cheese-400 font-bold">0 🧀CX</span></div>
                <div class="flex gap-2">
                    <button onclick="window.print()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg text-xs font-bold">🖨️ Print</button>
                    <button onclick="closeReceiptModal()" class="px-3 py-1.5 bg-cheese-500 hover:bg-cheese-400 text-slate-950 rounded-lg text-xs font-extrabold">Done</button>
                </div>
            </div>
        </div>
    </div>

    <!-- GAME JAVASCRIPT LOGIC -->
    <script>
        // WEB AUDIO SYNTHESIZER
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function playSound(type) {
            try {
                if (!audioCtx) audioCtx = new AudioCtx();
                if (audioCtx.state === 'suspended') audioCtx.resume();

                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                const now = audioCtx.currentTime;

                if (type === 'buy') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(587.33, now); // D5
                    osc.frequency.exponentialRampToValueAtTime(880, now + 0.08); // A5
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
                    osc.start(now);
                    osc.stop(now + 0.08);
                } else if (type === 'sell') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(880, now);
                    osc.frequency.exponentialRampToValueAtTime(440, now + 0.08);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
                    osc.start(now);
                    osc.stop(now + 0.08);
                } else if (type === 'fanfare') {
                    [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
                        const o = audioCtx.createOscillator();
                        const g = audioCtx.createGain();
                        o.connect(g);
                        g.connect(audioCtx.destination);
                        o.frequency.setValueAtTime(freq, now + i * 0.06);
                        g.gain.setValueAtTime(0.1, now + i * 0.06);
                        g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.06 + 0.15);
                        o.start(now + i * 0.06);
                        o.stop(now + i * 0.06 + 0.15);
                    });
                }
            } catch(e) {}
        }

        // CONFETTI ANIMATION SYSTEM
        function triggerConfetti() {
            playSound('fanfare');
            const canvas = document.getElementById('confetti-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const particles = [];
            const colors = ['#facc15', '#eab308', '#10b981', '#6366f1', '#ec4899'];

            for (let i = 0; i < 120; i++) {
                particles.push({
                    x: canvas.width / 2,
                    y: canvas.height / 2,
                    vx: (Math.random() - 0.5) * 18,
                    vy: (Math.random() - 0.7) * 18,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    size: Math.random() * 8 + 4,
                    life: 100
                });
            }

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                let alive = false;

                particles.forEach(p => {
                    if (p.life > 0) {
                        alive = true;
                        p.x += p.vx;
                        p.y += p.vy;
                        p.vy += 0.3; // Gravity
                        p.life -= 1.5;
                        ctx.fillStyle = p.color;
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                        ctx.fill();
                    }
                });

                if (alive) requestAnimationFrame(animate);
            }
            animate();
        }

        // PRESET GUYS & DEFAULT CATALOG GENERATOR (200 ITEMS)
        const PRESET_GUYS = [
            { id: 'bill', name: 'Bill Gates', worth: 100000000000, emoji: '👨‍💼', tagline: '"Tech pioneer turned philanthropist extra sharp!"' },
            { id: 'elon', name: 'Elon Musk', worth: 250000000000, emoji: '🚀', tagline: '"Sending Gouda cheese to Mars by 2028."' },
            { id: 'steve', name: 'Minecraft Steve', worth: 999000000000, emoji: '⛏️', tagline: '"Mined 64 stacks of pure Cheese Blocks."' },
            { id: 'noob', name: 'Roblox Noob', worth: 50000000000, emoji: '🟡', tagline: '"OOF! Spending Robux and 🧀CX everywhere."' },
            { id: 'gouda', name: 'King Gouda', worth: 10000000000000, emoji: '🧀', tagline: '"Supreme Sovereign of the Cheese Galaxy."' }
        ];

        // Base 200 Items Generator
        const BASE_ITEMS = [];
        const categories = ['Cheese', 'Gaming', 'Vehicles', 'Estates', 'Cosmic'];
        const emojis = {
            Cheese: ['🧀', '🍕', '🍔', '🌮', '🫕', '🥪', '🥨'],
            Gaming: ['🎮', '🕹️', '💻', '🎧', '⌨️', '🖥️', '👾'],
            Vehicles: ['🚗', '🏎️', '🚁', '🛩️', '🚀', '⛵', '🛸'],
            Estates: ['🏠', '🏰', '🏝️', '🏙️', '🌌', '🗽', '🗼'],
            Cosmic: ['⭐', '🪐', '🌟', '☄️', '🌌', '🛰️', '✨']
        };

        // Generating clean scaled prices from 1 up to 10 Trillion
        let currentPrice = 1;
        for (let i = 1; i <= 200; i++) {
            const cat = categories[(i - 1) % categories.length];
            const catEmojis = emojis[cat];
            const emoji = catEmojis[(i - 1) % catEmojis.length];
            
            BASE_ITEMS.push({
                id: i,
                name: `${cat} Spec #${i}`,
                price: Math.round(currentPrice),
                category: cat,
                icon: emoji,
                qty: 0
            });

            // Exponential smooth scaling for 200 items
            if (i < 20) currentPrice += 2;
            else if (i < 50) currentPrice *= 1.25;
            else if (i < 100) currentPrice *= 1.35;
            else if (i < 150) currentPrice *= 1.45;
            else currentPrice *= 1.55;
        }

        // GAME STATE
        let activeGuy = PRESET_GUYS[0];
        let items = JSON.parse(JSON.stringify(BASE_ITEMS));
        let customGuys = [];
        let activeMultiplier = 1; // 1, 10, 100, 1000, or 'MAX'
        let milestoneReached = { 25: false, 50: false, 75: false, 100: false };

        // INITIALIZATION
        function init() {
            populateGuySelect();
            switchGuy('bill');
        }

        function populateGuySelect() {
            const select = document.getElementById('guy-select');
            select.innerHTML = '';
            
            const allGuys = [...PRESET_GUYS, ...customGuys];
            allGuys.forEach(guy => {
                const opt = document.createElement('option');
                opt.value = guy.id;
                opt.textContent = `${guy.name} (${formatCX(guy.worth)})`;
                select.appendChild(opt);
            });
        }

        function switchGuy(guyId) {
            const allGuys = [...PRESET_GUYS, ...customGuys];
            activeGuy = allGuys.find(g => g.id === guyId) || PRESET_GUYS[0];

            // Reset purchases on guy switch
            items.forEach(i => i.qty = 0);
            milestoneReached = { 25: false, 50: false, 75: false, 100: false };

            // Update Header Display
            document.getElementById('guy-emoji').textContent = activeGuy.emoji.length <= 4 ? activeGuy.emoji : '👤';
            if (activeGuy.emoji.startsWith('http')) {
                document.getElementById('guy-avatar-wrapper').innerHTML = `<img src="${activeGuy.emoji}" class="w-full h-full object-cover">`;
            } else {
                document.getElementById('guy-avatar-wrapper').innerHTML = `<span id="guy-emoji" class="text-2xl">${activeGuy.emoji}</span>`;
            }

            document.getElementById('guy-tagline').textContent = activeGuy.tagline;
            updateUI();
        }

        function setMultiplier(val) {
            activeMultiplier = val;
            document.querySelectorAll('.mult-btn').forEach(btn => {
                btn.className = "mult-btn px-2.5 py-1 text-xs font-extrabold rounded-md border border-slate-700 bg-slate-800 text-slate-300 hover:border-slate-500";
            });
            const activeBtn = document.getElementById(`mult-${val}`);
            if (activeBtn) {
                activeBtn.className = "mult-btn px-2.5 py-1 text-xs font-extrabold rounded-md border border-cheese-400 bg-cheese-400 text-slate-950 shadow-md";
            }
            renderItems();
        }

        function getSpentTotal() {
            return items.reduce((sum, item) => sum + (item.price * item.qty), 0);
        }

        function getRemainingBalance() {
            return activeGuy.worth - getSpentTotal();
        }

        function calculateBuyAmount(item) {
            const balance = getRemainingBalance();
            if (activeMultiplier === 'MAX') {
                return Math.max(1, Math.floor(balance / item.price));
            }
            return activeMultiplier;
        }

        function buyItem(id) {
            const item = items.find(i => i.id === id);
            if (!item) return;

            const qtyToBuy = calculateBuyAmount(item);
            const totalCost = item.price * qtyToBuy;
            const balance = getRemainingBalance();

            if (balance >= totalCost && qtyToBuy > 0) {
                item.qty += qtyToBuy;
                playSound('buy');
                checkMilestones();
                updateUI();
            } else {
                playSound('sell');
            }
        }

        function sellItem(id) {
            const item = items.find(i => i.id === id);
            if (!item || item.qty <= 0) return;

            const qtyToSell = activeMultiplier === 'MAX' ? item.qty : Math.min(item.qty, activeMultiplier);
            item.qty -= qtyToSell;
            playSound('sell');
            updateUI();
        }

        function checkMilestones() {
            const spent = getSpentTotal();
            const pct = (spent / activeGuy.worth) * 100;

            [25, 50, 75, 100].forEach(m => {
                if (pct >= m && !milestoneReached[m]) {
                    milestoneReached[m] = true;
                    triggerConfetti();
                }
            });
        }

        function updateUI() {
            const spent = getSpentTotal();
            const balance = getRemainingBalance();
            const pct = Math.min(100, (spent / activeGuy.worth) * 100);

            document.getElementById('balance-display').textContent = `${formatCX(balance)} 🧀CX`;
            document.getElementById('spent-display').textContent = `${formatCX(spent)} 🧀CX`;
            document.getElementById('percent-display').textContent = `${pct.toFixed(2)}%`;
            document.getElementById('progress-bar').style.width = `${pct}%`;

            const totalItemsBought = items.reduce((a, b) => a + b.qty, 0);
            document.getElementById('cart-count').textContent = totalItemsBought;

            renderItems();
        }

        function renderItems() {
            const grid = document.getElementById('items-grid');
            const search = document.getElementById('search-input').value.toLowerCase();
            const cat = document.getElementById('category-select').value;
            const balance = getRemainingBalance();

            const filtered = items.filter(item => {
                const matchesSearch = item.name.toLowerCase().includes(search);
                const matchesCat = cat === 'ALL' || item.category === cat;
                return matchesSearch && matchesCat;
            });

            grid.innerHTML = '';

            filtered.forEach(item => {
                const buyQty = calculateBuyAmount(item);
                const totalBuyCost = item.price * buyQty;
                const canAfford = balance >= item.price;

                const card = document.createElement('div');
                card.className = `glass-panel rounded-2xl p-4 flex flex-col justify-between transition-all duration-200 hover:border-slate-600 ${item.qty > 0 ? 'border-cheese-500/50 bg-slate-900/90' : ''}`;

                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start mb-2">
                            <span class="text-3xl p-2 bg-slate-800/80 rounded-xl">${item.icon}</span>
                            <span class="text-[10px] font-mono text-slate-400 border border-slate-800 px-2 py-0.5 rounded-full">#${item.id}</span>
                        </div>
                        <h4 class="font-bold text-sm text-slate-100 line-clamp-1">${item.name}</h4>
                        <div class="text-cheese-400 font-extrabold font-mono text-sm mt-1">${formatCX(item.price)} 🧀CX</div>
                    </div>

                    <div class="mt-4 pt-3 border-t border-slate-800/80">
                        <div class="flex items-center justify-between gap-2 mb-2">
                            <button onclick="sellItem(${item.id})" ${item.qty <= 0 ? 'disabled' : ''} class="w-1/2 py-1.5 rounded-lg text-xs font-bold transition ${item.qty > 0 ? 'bg-rose-950 hover:bg-rose-900 border border-rose-800 text-rose-300' : 'bg-slate-900 text-slate-600 cursor-not-allowed'}">
                                Sell
                            </button>
                            <button onclick="buyItem(${item.id})" ${!canAfford ? 'disabled' : ''} class="w-1/2 py-1.5 rounded-lg text-xs font-extrabold transition ${canAfford ? 'bg-emerald-500 hover:bg-emerald-400 text-slate-950 shadow-md' : 'bg-slate-900 text-slate-600 cursor-not-allowed'}">
                                Buy (${buyQty})
                            </button>
                        </div>
                        <div class="text-center text-[11px] font-mono font-bold text-slate-400">
                            Owned: <span class="${item.qty > 0 ? 'text-cheese-300 font-black' : 'text-slate-500'}">${item.qty}</span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // CUSTOM GUY & ITEM MODAL LOGIC
        function openCustomGuyModal() { document.getElementById('custom-guy-modal').classList.remove('hidden'); }
        function closeCustomGuyModal() { document.getElementById('custom-guy-modal').classList.add('hidden'); }
        function openCustomItemModal() { document.getElementById('custom-item-modal').classList.remove('hidden'); }
        function closeCustomItemModal() { document.getElementById('custom-item-modal').classList.add('hidden'); }

        function saveCustomGuy() {
            const name = document.getElementById('guy-name-input').value.trim() || 'Custom Cheese Baller';
            const avatar = document.getElementById('guy-avatar-input').value.trim() || '🧀';
            const worth = parseFloat(document.getElementById('guy-worth-input').value) || 1000000000;
            const tagline = document.getElementById('guy-tagline-input').value.trim() || '"Ready to spend big!"';

            const newGuy = { id: 'custom_' + Date.now(), name, worth, emoji: avatar, tagline };
            customGuys.push(newGuy);
            populateGuySelect();
            closeCustomGuyModal();
            switchGuy(newGuy.id);
            playSound('fanfare');
        }

        function saveCustomItem() {
            const name = document.getElementById('item-name-input').value.trim() || 'Custom Cheese Relic';
            const price = parseFloat(document.getElementById('item-price-input').value) || 100;
            const icon = document.getElementById('item-icon-input').value.trim() || '✨';

            const newItem = {
                id: items.length + 1,
                name,
                price: Math.round(price),
                category: 'Custom',
                icon,
                qty: 0
            };

            items.push(newItem);
            closeCustomItemModal();
            updateUI();
            playSound('fanfare');
        }

        // RECEIPT MODAL
        function openReceiptModal() {
            const container = document.getElementById('receipt-content');
            container.innerHTML = '';

            const bought = items.filter(i => i.qty > 0);
            if (bought.length === 0) {
                container.innerHTML = `<div class="text-center text-slate-500 py-8">You haven't bought anything yet! Start spending! 🧀💸</div>`;
            } else {
                bought.forEach(item => {
                    const row = document.createElement('div');
                    row.className = 'flex justify-between border-b border-slate-800/60 pb-1';
                    row.innerHTML = `
                        <span>${item.icon} ${item.name} x${item.qty}</span>
                        <span class="text-cheese-400">${formatCX(item.price * item.qty)} 🧀CX</span>
                    `;
                    container.appendChild(row);
                });
            }

            document.getElementById('receipt-total').textContent = `${formatCX(getSpentTotal())} 🧀CX`;
            document.getElementById('receipt-modal').classList.remove('hidden');
        }

        function closeReceiptModal() { document.getElementById('receipt-modal').classList.add('hidden'); }

        function resetGame() {
            items.forEach(i => i.qty = 0);
            milestoneReached = { 25: false, 50: false, 75: false, 100: false };
            updateUI();
            playSound('sell');
        }

        function formatCX(num) {
            return new Intl.NumberFormat('en-US').format(num);
        }

        // Initialize game on load
        window.onload = init;
    </script>
</body>
</html>
