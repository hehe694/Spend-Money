    <script>
        // WEB AUDIO SYNTHESIZER
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function playSound(type) {
            try {
                if (!audioCtx) audioCtx = new AudioCtx();
                if (audioCtx.state === 'suspended') audioCtx.resume();

                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                const now = audioCtx.currentTime;

                if (type === 'buy') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(587.33, now);
                    osc.frequency.exponentialRampToValueAtTime(880, now + 0.08);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
                    osc.start(now);
                    osc.stop(now + 0.08);
                } else if (type === 'sell') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(880, now);
                    osc.frequency.exponentialRampToValueAtTime(440, now + 0.08);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
                    osc.start(now);
                    osc.stop(now + 0.08);
                } else if (type === 'fanfare') {
                    [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
                        const o = audioCtx.createOscillator();
                        const g = audioCtx.createGain();
                        o.connect(g);
                        g.connect(audioCtx.destination);
                        o.frequency.setValueAtTime(freq, now + i * 0.06);
                        g.gain.setValueAtTime(0.1, now + i * 0.06);
                        g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.06 + 0.15);
                        o.start(now + i * 0.06);
                        o.stop(now + i * 0.06 + 0.15);
                    });
                }
            } catch(e) {}
        }

        // CONFETTI ANIMATION SYSTEM
        function triggerConfetti() {
            playSound('fanfare');
            const canvas = document.getElementById('confetti-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const particles = [];
            const colors = ['#facc15', '#eab308', '#10b981', '#6366f1', '#ec4899'];

            for (let i = 0; i < 120; i++) {
                particles.push({
                    x: canvas.width / 2,
                    y: canvas.height / 2,
                    vx: (Math.random() - 0.5) * 18,
                    vy: (Math.random() - 0.7) * 18,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    size: Math.random() * 8 + 4,
                    life: 100
                });
            }

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                let alive = false;

                particles.forEach(p => {
                    if (p.life > 0) {
                        alive = true;
                        p.x += p.vx;
                        p.y += p.vy;
                        p.vy += 0.3;
                        p.life -= 1.5;
                        ctx.fillStyle = p.color;
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                        ctx.fill();
                    }
                });

                if (alive) requestAnimationFrame(animate);
            }
            animate();
        }

            // Tier 6: Mega Flex & Megastructures ($100,000,000 to $10,000,000,000)
            { name: "Universal Cheese Slicer Satellite", price: 120000000, cat: "Cheese", icon: "🛰️" },
            { name: "Esports Arena Naming Rights", price: 180000000, cat: "Gaming", icon: "🏟️" },
            { name: "300ft Superyacht Fleet", price: 280000000, cat: "Vehicles", icon: "🛥️" },
            { name: "AI Neural Network Data Center", price: 450000000, cat: "Gaming", icon: "🧠" },
            { name: "Antarctic Research Base Plot", price: 650000000, cat: "Estates", icon: "❄️" },
            { name: "Original Mona Lisa Painting", price: 880000000, cat: "Cosmic", icon: "🖼️" },
            { name: "100-Story Skyscraper Tower", price: 1200000000, cat: "Estates", icon: "🏙️" },
            { name: "Nuclear Powered Submarine", price: 2000000000, cat: "Vehicles", icon: "⚓" },
            { name: "Amazon Rainforest Reserve Land", price: 3500000000, cat: "Estates", icon: "🌳" },
            { name: "SpaceX Reusable Starship Fleet", price: 5500000000, cat: "Vehicles", icon: "🚀" },
            { name: "Bullet Train Transit Network", price: 8500000000, cat: "Vehicles", icon: "🚆" },

            // Tier 7: Planetary, Cosmic & Galactic Flexes ($10B to $10 Trillion)
            { name: "Orbital Space Hotel Station", price: 15000000000, cat: "Cosmic", icon: "🏨" },
            { name: "Moon Base Alpha Colony", price: 30000000000, cat: "Cosmic", icon: "🌕" },
            { name: "Space Elevator Launch Shaft", price: 50000000000, cat: "Vehicles", icon: "🛗" },
            { name: "Asteroid Mining Operations Base", price: 85000000000, cat: "Cosmic", icon: "☄️" },
            { name: "Terraformed Mars City Complex", price: 150000000000, cat: "Cosmic", icon: "🪐" },
            { name: "Dyson Swarm Solar Array Ring", price: 500000000000, cat: "Cosmic", icon: "☀️" },
            { name: "Jupiter Cloud Floating Station", price: 800000000000, cat: "Cosmic", icon: "🪐" },
            { name: "Interstellar Warp Drive Propulsion", price: 2500000000000, cat: "Cosmic", icon: "🌌" },
            { name: "Black Hole Energy Harvester", price: 5000000000000, cat: "Cosmic", icon: "🕳️" },
            { name: "Parallel Cheese Multiverse Matrix", price: 10000000000000, cat: "Cosmic", icon: "✨" }
        ];

        // Generate clean procedural scaling for full 200 items smoothly
        const BASE_ITEMS = [];
        let curPrice = 1;

        // Base names pool to ensure 200 items are filled with 100% unique handcrafted names
        for (let i = 1; i <= 200; i++) {
            let base = HANDCRAFTED_200_ITEMS[i - 1];
            if (!base) {
                // Extended unique names if needed
                const cats = ["Cheese", "Gaming", "Vehicles", "Estates", "Cosmic"];
                const icons = ["🧀", "🎮", "🚀", "🏰", "🌌"];
                const pick = (i % 5);
                base = {
                    name: `Ultra ${cats[pick]} Artifact Level ${i}`,
                    price: Math.round(curPrice),
                    cat: cats[pick],
                    icon: icons[pick]
                };
            }
            
            BASE_ITEMS.push({
                id: i,
                name: base.name,
                price: base.price,
                category: base.cat,
                icon: base.icon,
                qty: 0
            });

            curPrice *= 1.18;
        }

        // Sort items strictly by price
        BASE_ITEMS.sort((a, b) => a.price - b.price);
        BASE_ITEMS.forEach((item, index) => item.id = index + 1);

        // GAME STATE
        let activeGuy = PRESET_GUYS[0];
        let items = JSON.parse(JSON.stringify(BASE_ITEMS));
        let customGuys = [];
        let activeMultiplier = 1;
        let milestoneReached = { 25: false, 50: false, 75: false, 100: false };

        // INITIALIZATION
        function init() {
            populateGuySelect();
            switchGuy('bill');
        }

        function populateGuySelect() {
            const select = document.getElementById('guy-select');
            select.innerHTML = '';
            
            const allGuys = [...PRESET_GUYS, ...customGuys];
            allGuys.forEach(guy => {
                const opt = document.createElement('option');
                opt.value = guy.id;
                opt.textContent = `${guy.name} (${formatCX(guy.worth)})`;
                select.appendChild(opt);
            });
        }

        function switchGuy(guyId) {
            const allGuys = [...PRESET_GUYS, ...customGuys];
            activeGuy = allGuys.find(g => g.id === guyId) || PRESET_GUYS[0];

            items.forEach(i => i.qty = 0);
            milestoneReached = { 25: false, 50: false, 75: false, 100: false };

            document.getElementById('guy-emoji').textContent = activeGuy.emoji.length <= 4 ? activeGuy.emoji : '👤';
            if (activeGuy.emoji.startsWith('http')) {
                document.getElementById('guy-avatar-wrapper').innerHTML = `<img src="${activeGuy.emoji}" class="w-full h-full object-cover">`;
            } else {
                document.getElementById('guy-avatar-wrapper').innerHTML = `<span id="guy-emoji" class="text-2xl">${activeGuy.emoji}</span>`;
            }

            document.getElementById('guy-tagline').textContent = activeGuy.tagline;
            updateUI();
        }

        function setMultiplier(val) {
            activeMultiplier = val;
            document.querySelectorAll('.mult-btn').forEach(btn => {
                btn.className = "mult-btn px-2.5 py-1 text-xs font-extrabold rounded-md border border-slate-700 bg-slate-800 text-slate-300 hover:border-slate-500";
            });
            const activeBtn = document.getElementById(`mult-${val}`);
            if (activeBtn) {
                activeBtn.className = "mult-btn px-2.5 py-1 text-xs font-extrabold rounded-md border border-cheese-400 bg-cheese-400 text-slate-950 shadow-md";
            }
            renderItems();
        }

        function getSpentTotal() {
            return items.reduce((sum, item) => sum + (item.price * item.qty), 0);
        }

        function getRemainingBalance() {
            return activeGuy.worth - getSpentTotal();
        }

        function calculateBuyAmount(item) {
            const balance = getRemainingBalance();
            if (activeMultiplier === 'MAX') {
                return Math.max(1, Math.floor(balance / item.price));
            }
            return activeMultiplier;
        }

        function buyItem(id) {
            const item = items.find(i => i.id === id);
            if (!item) return;

            const qtyToBuy = calculateBuyAmount(item);
            const totalCost = item.price * qtyToBuy;
            const balance = getRemainingBalance();

            if (balance >= totalCost && qtyToBuy > 0) {
                item.qty += qtyToBuy;
                playSound('buy');
                checkMilestones();
                updateUI();
            } else {
                playSound('sell');
            }
        }

        function sellItem(id) {
            const item = items.find(i => i.id === id);
            if (!item || item.qty <= 0) return;

            const qtyToSell = activeMultiplier === 'MAX' ? item.qty : Math.min(item.qty, activeMultiplier);
            item.qty -= qtyToSell;
            playSound('sell');
            updateUI();
        }

        function checkMilestones() {
            const spent = getSpentTotal();
            const pct = (spent / activeGuy.worth) * 100;

            [25, 50, 75, 100].forEach(m => {
                if (pct >= m && !milestoneReached[m]) {
                    milestoneReached[m] = true;
                    triggerConfetti();
                }
            });
        }

        function updateUI() {
            const spent = getSpentTotal();
            const balance = getRemainingBalance();
            const pct = Math.min(100, (spent / activeGuy.worth) * 100);

            document.getElementById('balance-display').textContent = `${formatCX(balance)} 🧀CX`;
            document.getElementById('spent-display').textContent = `${formatCX(spent)} 🧀CX`;
            document.getElementById('percent-display').textContent = `${pct.toFixed(2)}%`;
            document.getElementById('progress-bar').style.width = `${pct}%`;

            const totalItemsBought = items.reduce((a, b) => a + b.qty, 0);
            document.getElementById('cart-count').textContent = totalItemsBought;

            renderItems();
        }

        function renderItems() {
            const grid = document.getElementById('items-grid');
            const search = document.getElementById('search-input').value.toLowerCase();
            const cat = document.getElementById('category-select').value;
            const balance = getRemainingBalance();

            const filtered = items.filter(item => {
                const matchesSearch = item.name.toLowerCase().includes(search);
                const matchesCat = cat === 'ALL' || item.category === cat;
                return matchesSearch && matchesCat;
            });

            grid.innerHTML = '';

            filtered.forEach(item => {
                const buyQty = calculateBuyAmount(item);
                const canAfford = balance >= item.price;

                const card = document.createElement('div');
                card.className = `glass-panel rounded-2xl p-4 flex flex-col justify-between transition-all duration-200 hover:border-slate-600 ${item.qty > 0 ? 'border-cheese-500/50 bg-slate-900/90' : ''}`;

                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start mb-2">
                            <span class="text-3xl p-2 bg-slate-800/80 rounded-xl">${item.icon}</span>
                            <span class="text-[10px] font-mono text-slate-400 border border-slate-800 px-2 py-0.5 rounded-full">#${item.id}</span>
                        </div>
                        <h4 class="font-bold text-sm text-slate-100 line-clamp-1">${item.name}</h4>
                        <div class="text-cheese-400 font-extrabold font-mono text-sm mt-1">${formatCX(item.price)} 🧀CX</div>
                    </div>

                    <div class="mt-4 pt-3 border-t border-slate-800/80">
                        <div class="flex items-center justify-between gap-2 mb-2">
                            <button onclick="sellItem(${item.id})" ${item.qty <= 0 ? 'disabled' : ''} class="w-1/2 py-1.5 rounded-lg text-xs font-bold transition ${item.qty > 0 ? 'bg-rose-950 hover:bg-rose-900 border border-rose-800 text-rose-300' : 'bg-slate-900 text-slate-600 cursor-not-allowed'}">
                                Sell
                            </button>
                            <button onclick="buyItem(${item.id})" ${!canAfford ? 'disabled' : ''} class="w-1/2 py-1.5 rounded-lg text-xs font-extrabold transition ${canAfford ? 'bg-emerald-500 hover:bg-emerald-400 text-slate-950 shadow-md' : 'bg-slate-900 text-slate-600 cursor-not-allowed'}">
                                Buy (${buyQty})
                            </button>
                        </div>
                        <div class="text-center text-[11px] font-mono font-bold text-slate-400">
                            Owned: <span class="${item.qty > 0 ? 'text-cheese-300 font-black' : 'text-slate-500'}">${item.qty}</span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // CUSTOM GUY & ITEM MODAL LOGIC
        function openCustomGuyModal() { document.getElementById('custom-guy-modal').classList.remove('hidden'); }
        function closeCustomGuyModal() { document.getElementById('custom-guy-modal').classList.add('hidden'); }
        function openCustomItemModal() { document.getElementById('custom-item-modal').classList.remove('hidden'); }
        function closeCustomItemModal() { document.getElementById('custom-item-modal').classList.add('hidden'); }

        function saveCustomGuy() {
            const name = document.getElementById('guy-name-input').value.trim() || 'Custom Cheese Baller';
            const avatar = document.getElementById('guy-avatar-input').value.trim() || '🧀';
            const worth = parseFloat(document.getElementById('guy-worth-input').value) || 1000000000;
            const tagline = document.getElementById('guy-tagline-input').value.trim() || '"Ready to spend big!"';

            const newGuy = { id: 'custom_' + Date.now(), name, worth, emoji: avatar, tagline };
            customGuys.push(newGuy);
            populateGuySelect();
            closeCustomGuyModal();
            switchGuy(newGuy.id);
            playSound('fanfare');
        }

        function saveCustomItem() {
            const name = document.getElementById('item-name-input').value.trim() || 'Custom Cheese Relic';
            const price = parseFloat(document.getElementById('item-price-input').value) || 100;
            const icon = document.getElementById('item-icon-input').value.trim() || '✨';

            const newItem = {
                id: items.length + 1,
                name,
                price: Math.round(price),
                category: 'Custom',
                icon,
                qty: 0
            };

            items.push(newItem);
            closeCustomItemModal();
            updateUI();
            playSound('fanfare');
        }

        // RECEIPT MODAL & HTML CANVAS IMAGE GENERATOR
        function openReceiptModal() {
            const container = document.getElementById('receipt-content');
            container.innerHTML = '';

            const bought = items.filter(i => i.qty > 0);
            if (bought.length === 0) {
                container.innerHTML = `<div class="text-center text-slate-500 py-8">You haven't bought anything yet! Start spending! 🧀💸</div>`;
            } else {
                bought.forEach(item => {
                    const row = document.createElement('div');
                    row.className = 'flex justify-between border-b border-slate-800/60 pb-1';
                    row.innerHTML = `
                        <span>${item.icon} ${item.name} x${item.qty}</span>
                        <span class="text-cheese-400">${formatCX(item.price * item.qty)} 🧀CX</span>
                    `;
                    container.appendChild(row);
                });
            }

            document.getElementById('receipt-total').textContent = `${formatCX(getSpentTotal())} 🧀CX`;
            document.getElementById('receipt-modal').classList.remove('hidden');
        }

        function closeReceiptModal() { document.getElementById('receipt-modal').classList.add('hidden'); }

        // DRAW RECEIPT DIRECTLY TO A PNG CANVAS AND DOWNLOAD
        function saveReceiptAsImage() {
            const bought = items.filter(i => i.qty > 0);
            if (bought.length === 0) {
                alert("Your cart is empty! Buy some cheese items first!");
                return;
            }

            const canvas = document.getElementById('receipt-canvas');
            const ctx = canvas.getContext('2d');

            // Set canvas size for receipt thermal image
            const width = 550;
            const rowHeight = 28;
            const headerHeight = 220;
            const footerHeight = 120;
            const height = headerHeight + (bought.length * rowHeight) + footerHeight;

            canvas.width = width;
            canvas.height = height;

            // Background
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(0, 0, width, height);

            // Border
            ctx.strokeStyle = '#eab308';
            ctx.lineWidth = 4;
            ctx.strokeRect(10, 10, width - 20, height - 20);

            // Header Text
            ctx.fillStyle = '#facc15';
            ctx.font = 'bold 22px monospace';
            ctx.textAlign = 'center';
            ctx.fillText('🧀 CHEESE CASH (🧀CX) RECEIPT 🧀', width / 2, 50);

            ctx.fillStyle = '#94a3b8';
            ctx.font = '14px monospace';
            ctx.fillText(`Target: ${activeGuy.name}`, width / 2, 80);
            ctx.fillText(`Date: ${new Date().toLocaleDateString()} ${new Date().toLocaleTimeString()}`, width / 2, 105);

            // Separator Line
            ctx.strokeStyle = '#334155';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(30, 130);
            ctx.lineTo(width - 30, 130);
            ctx.stroke();

            // Items List
            ctx.textAlign = 'left';
            let y = 160;

            bought.forEach(item => {
                ctx.fillStyle = '#f8fafc';
                ctx.font = '13px monospace';
                
                // Truncate long names
                let nameStr = `${item.icon} ${item.name} x${item.qty}`;
                if (nameStr.length > 28) nameStr = nameStr.substring(0, 25) + '...';

                ctx.fillText(nameStr, 35, y);

                ctx.textAlign = 'right';
                ctx.fillStyle = '#facc15';
                ctx.fillText(`${formatCX(item.price * item.qty)} CX`, width - 35, y);
                ctx.textAlign = 'left';

                y += rowHeight;
            });

            // Separator Line
            ctx.strokeStyle = '#334155';
            ctx.beginPath();
            ctx.moveTo(30, y + 10);
            ctx.lineTo(width - 30, y + 10);
            ctx.stroke();

            // Total Spent Summary
            y += 45;
            ctx.fillStyle = '#10b981';
            ctx.font = 'bold 18px monospace';
            ctx.fillText('TOTAL SPENT:', 35, y);

            ctx.textAlign = 'right';
            ctx.fillStyle = '#facc15';
            ctx.font = 'bold 20px monospace';
            ctx.fillText(`${formatCX(getSpentTotal())} 🧀CX`, width - 35, y);

            // Watermark Footer
            y += 40;
            ctx.textAlign = 'center';
            ctx.fillStyle = '#64748b';
            ctx.font = '11px monospace';
            ctx.fillText('Thank you for spending Bill Gates & Friends Cheese Money! 🧀', width / 2, y);

            // Trigger Image Download
            const dataURL = canvas.toDataURL('image/png');
            const link = document.createElement('a');
            link.download = `Cheese_Receipt_${activeGuy.name.replace(/\s+/g, '_')}_${Date.now()}.png`;
            link.href = dataURL;
            link.click();

            playSound('fanfare');
        }

        function resetGame() {
            items.forEach(i => i.qty = 0);
            milestoneReached = { 25: false, 50: false, 75: false, 100: false };
            updateUI();
            playSound('sell');
        }

        function formatCX(num) {
            return new Intl.NumberFormat('en-US').format(num);
        }

        window.onload = init;
    </script>
</body>
</html>
