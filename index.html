        // Parse 200 items into JS objects
        let items = rawItemData.trim().split('\n').map((line, index) => {
            let [name, price, category, icon] = line.split('|');
            return { id: index + 1, name, price: parseInt(price), category, icon, qty: 0 };
        });

        // Ensure array is strictly sorted by price
        items.sort((a, b) => a.price - b.price);
        items.forEach((item, index) => item.id = index + 1);

        let activeGuy = PRESET_GUYS[0];
        let activeMultiplier = 1;
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function playSound(type) {
            try {
                if (!audioCtx) audioCtx = new AudioCtx();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                const now = audioCtx.currentTime;
                if (type === 'buy') {
                    osc.frequency.setValueAtTime(520, now);
                    osc.frequency.exponentialRampToValueAtTime(840, now + 0.08);
                    gain.gain.setValueAtTime(0.12, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
                } else if (type === 'sell') {
                    osc.frequency.setValueAtTime(840, now);
                    osc.frequency.exponentialRampToValueAtTime(420, now + 0.08);
                    gain.gain.setValueAtTime(0.12, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
                } else {
                    [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
                        const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
                        o.connect(g); g.connect(audioCtx.destination);
                        o.frequency.setValueAtTime(freq, now + i * 0.06);
                        g.gain.setValueAtTime(0.1, now + i * 0.06);
                        g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.06 + 0.15);
                        o.start(now + i * 0.06); o.stop(now + i * 0.06 + 0.15);
                    });
                }
                osc.start(now); osc.stop(now + 0.08);
            } catch(e) {}
        }

        function init() {
            populateGuyDropdown();
            switchGuy('bill');
        }

        function populateGuyDropdown() {
            const select = document.getElementById('guy-select');
            select.innerHTML = '';
            PRESET_GUYS.forEach(guy => {
                const opt = document.createElement('option');
                opt.value = guy.id; opt.textContent = `${guy.name}`;
                select.appendChild(opt);
            });
        }

        function switchGuy(guyId) {
            activeGuy = PRESET_GUYS.find(g => g.id === guyId) || PRESET_GUYS[0];
            items.forEach(i => i.qty = 0);
            document.getElementById('guy-emoji').textContent = activeGuy.emoji;
            document.getElementById('guy-tagline').textContent = activeGuy.tagline;
            updateUI();
        }

        function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

        // SAVE CUSTOM TARGET GUY
        function saveCustomGuy() {
            const name = document.getElementById('custom-guy-name').value.trim();
            const worth = parseInt(document.getElementById('custom-guy-worth').value);
            const emoji = document.getElementById('custom-guy-emoji').value.trim() || '👨‍💼';
            const tagline = document.getElementById('custom-guy-tagline').value.trim() || '"Ready to spend big!"';

            if (!name || isNaN(worth) || worth <= 0) {
                alert('Please enter a valid Guy Name and Worth!'); return;
            }

            const newGuy = { id: 'custom_' + Date.now(), name, worth, emoji, tagline: `"${tagline}"` };
            PRESET_GUYS.push(newGuy);
            populateGuyDropdown();
            document.getElementById('guy-select').value = newGuy.id;
            switchGuy(newGuy.id);
            closeModal('add-guy-modal');

            // Reset inputs
            document.getElementById('custom-guy-name').value = '';
            document.getElementById('custom-guy-worth').value = '';
            document.getElementById('custom-guy-emoji').value = '';
            document.getElementById('custom-guy-tagline').value = '';
        }

        // SAVE CUSTOM ITEM
        function saveCustomItem() {
            const name = document.getElementById('custom-item-name').value.trim();
            const price = parseInt(document.getElementById('custom-item-price').value);
            const category = document.getElementById('custom-item-category').value;
            const icon = document.getElementById('custom-item-icon').value.trim() || '📦';

            if (!name || isNaN(price) || price <= 0) {
                alert('Please enter a valid Item Name and Price!'); return;
            }

            items.push({ id: items.length + 1, name, price, category, icon, qty: 0 });
            items.sort((a, b) => a.price - b.price);
            items.forEach((item, index) => item.id = index + 1);

            closeModal('add-item-modal');
            updateUI();

            // Reset inputs
            document.getElementById('custom-item-name').value = '';
            document.getElementById('custom-item-price').value = '';
            document.getElementById('custom-item-icon').value = '';
        }

        function setMultiplier(val) {
            activeMultiplier = val;
            document.querySelectorAll('.mult-btn').forEach(btn => {
                btn.className = "mult-btn px-2 py-1 text-xs font-extrabold rounded-md border border-slate-700 bg-slate-800 text-slate-300";
            });
            document.getElementById(`mult-${val}`).className = "mult-btn px-2 py-1 text-xs font-extrabold rounded-md border border-cheese-400 bg-cheese-400 text-slate-950";
            renderItems();
        }

        function getSpent() { return items.reduce((sum, item) => sum + (item.price * item.qty), 0); }
        function getBal() { return activeGuy.worth - getSpent(); }
        function calcBuyQty(item) {
            if (activeMultiplier === 'MAX') return Math.max(1, Math.floor(getBal() / item.price));
            return activeMultiplier;
        }

        function buyItem(id) {
            const item = items.find(i => i.id === id);
            const qty = calcBuyQty(item);
            if (getBal() >= item.price * qty && qty > 0) {
                item.qty += qty;
                playSound('buy');
                updateUI();
            }
        }

        function sellItem(id) {
            const item = items.find(i => i.id === id);
            if (item.qty > 0) {
                const qty = activeMultiplier === 'MAX' ? item.qty : Math.min(item.qty, activeMultiplier);
                item.qty -= qty;
                playSound('sell');
                updateUI();
            }
        }

        function updateUI() {
            const spent = getSpent();
            const bal = getBal();
            const pct = Math.min(100, (spent / activeGuy.worth) * 100);

            document.getElementById('balance-display').textContent = `${bal.toLocaleString()} 🧀CX`;
            document.getElementById('spent-display').textContent = `${spent.toLocaleString()} 🧀CX`;
            document.getElementById('percent-display').textContent = `${pct.toFixed(2)}%`;
            document.getElementById('progress-bar').style.width = `${pct}%`;
            document.getElementById('cart-count').textContent = items.reduce((a, b) => a + b.qty, 0);

            renderItems();
        }

        function renderItems() {
            const grid = document.getElementById('items-grid');
            const search = document.getElementById('search-input').value.toLowerCase();
            const cat = document.getElementById('category-select').value;
            const bal = getBal();

            grid.innerHTML = items.filter(item => 
                item.name.toLowerCase().includes(search) && (cat === 'ALL' || item.category === cat)
            ).map(item => `
                <div class="glass-panel rounded-xl p-3 flex flex-col justify-between ${item.qty > 0 ? 'border-cheese-500/50 bg-slate-900/90' : ''}">
                    <div>
                        <div class="flex justify-between items-start mb-1">
                            <span class="text-2xl">${item.icon}</span>
                            <span class="text-[9px] font-mono text-slate-500">#${item.id}</span>
                        </div>
                        <h4 class="font-bold text-[12px] leading-snug text-slate-100 mb-1 break-words">${item.name}</h4>
                        <div class="text-cheese-400 font-bold font-mono text-xs">${item.price.toLocaleString()} CX</div>
                    </div>
                    <div class="mt-3 pt-2 border-t border-slate-800/80 flex flex-col gap-1">
                        <div class="flex gap-1">
                            <button onclick="sellItem(${item.id})" class="flex-1 py-1 bg-rose-950 hover:bg-rose-900 text-rose-300 rounded text-[10px] font-bold ${item.qty <= 0 ? 'opacity-40 cursor-not-allowed' : ''}">Sell</button>
                            <button onclick="buyItem(${item.id})" class="flex-1 py-1 bg-emerald-500 hover:bg-emerald-400 text-slate-950 rounded text-[10px] font-extrabold ${bal < item.price ? 'opacity-40 cursor-not-allowed' : ''}">Buy</button>
                        </div>
                        <div class="text-center text-[10px] text-slate-400 font-mono mt-0.5">Owned: <span class="${item.qty > 0 ? 'text-cheese-400 font-bold' : ''}">${item.qty}</span></div>
                    </div>
                </div>
            `).join('');
        }

        function openReceiptModal() {
            const cont = document.getElementById('receipt-content');
            const bought = items.filter(i => i.qty > 0);
            cont.innerHTML = bought.length ? bought.map(i => `
                <div class="flex justify-between border-b border-slate-800/60 pb-1">
                    <span>${i.icon} ${i.name} x${i.qty}</span>
                    <span class="text-cheese-400">${(i.price * i.qty).toLocaleString()} CX</span>
                </div>
            `).join('') : '<div class="text-center text-slate-500 py-6">Cart is empty! Buy some items first! 🧀💸</div>';
            
            document.getElementById('receipt-total').textContent = `${getSpent().toLocaleString()} 🧀CX`;
            openModal('receipt-modal');
        }

        function saveReceiptAsImage() {
            const bought = items.filter(i => i.qty > 0);
            if (!bought.length) { alert("Cart empty!"); return; }

            const canvas = document.getElementById('receipt-canvas');
            const ctx = canvas.getContext('2d');
            const width = 500, rowH = 26, headH = 180, footH = 100;
            const height = headH + (bought.length * rowH) + footH;

            canvas.width = width; canvas.height = height;
            ctx.fillStyle = '#0f172a'; ctx.fillRect(0, 0, width, height);
            ctx.strokeStyle = '#eab308'; ctx.lineWidth = 4; ctx.strokeRect(8, 8, width - 16, height - 16);

            ctx.fillStyle = '#facc15'; ctx.font = 'bold 20px monospace'; ctx.textAlign = 'center';
            ctx.fillText('🧀 CHEESE CASH (🧀CX) RECEIPT 🧀', width / 2, 45);
            ctx.fillStyle = '#94a3b8'; ctx.font = '13px monospace';
            ctx.fillText(`Target: ${activeGuy.name}`, width / 2, 75);
            ctx.fillText(`Date: ${new Date().toLocaleDateString()} ${new Date().toLocaleTimeString()}`, width / 2, 98);

            ctx.strokeStyle = '#334155'; ctx.beginPath(); ctx.moveTo(25, 120); ctx.lineTo(width - 25, 120); ctx.stroke();

            let y = 150;
            bought.forEach(i => {
                ctx.textAlign = 'left'; ctx.fillStyle = '#f8fafc'; ctx.font = '12px monospace';
                let name = `${i.icon} ${i.name} x${i.qty}`;
                if (name.length > 28) name = name.substring(0, 25) + '...';
                ctx.fillText(name, 30, y);
                ctx.textAlign = 'right'; ctx.fillStyle = '#facc15';
                ctx.fillText(`${(i.price * i.qty).toLocaleString()} CX`, width - 30, y);
                y += rowH;
            });

            ctx.strokeStyle = '#334155'; ctx.beginPath(); ctx.moveTo(25, y + 10); ctx.lineTo(width - 25, y + 10); ctx.stroke();
            y += 40;
            ctx.textAlign = 'left'; ctx.fillStyle = '#10b981'; ctx.font = 'bold 16px monospace'; ctx.fillText('TOTAL SPENT:', 30, y);
            ctx.textAlign = 'right'; ctx.fillStyle = '#facc15'; ctx.font = 'bold 18px monospace'; ctx.fillText(`${getSpent().toLocaleString()} 🧀CX`, width - 30, y);

            const link = document.createElement('a');
            link.download = `Cheese_Receipt_${Date.now()}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
            playSound('fanfare');
        }

        function resetGame() { items.forEach(i => i.qty = 0); updateUI(); }

        window.onload = init;
    </script>
</body>
</html>
