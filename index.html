<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spend Their Money 🧀CX - Unique Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { cheese: { 300: '#FDE047', 400: '#FACC15', 500: '#EAB308' } } } }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #eab308; }
        .glass-panel {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans relative overflow-x-hidden">

    <canvas id="confetti-canvas" class="fixed inset-0 pointer-events-none z-50"></canvas>

    <header class="sticky top-0 z-40 glass-panel border-b border-slate-800 shadow-2xl">
        <div class="max-w-7xl mx-auto px-4 py-3">
            <div class="flex flex-wrap justify-between items-center gap-3 mb-3">
                <div class="flex items-center gap-3">
                    <div id="guy-avatar-wrapper" class="w-12 h-12 rounded-full bg-slate-800 border-2 border-cheese-400 flex items-center justify-center text-2xl overflow-hidden shadow-lg">
                        <span id="guy-emoji">👨‍💼</span>
                    </div>
                    <div>
                        <div class="flex items-center gap-2">
                            <label class="text-xs font-semibold text-slate-400 uppercase">Target Guy:</label>
                            <select id="guy-select" onchange="switchGuy(this.value)" class="bg-slate-800 border border-slate-700 text-cheese-400 text-sm font-bold rounded-lg px-2 py-1 outline-none cursor-pointer"></select>
                        </div>
                        <p id="guy-tagline" class="text-xs text-slate-400 italic mt-0.5">"I have more cash than I know what to do with!"</p>
                    </div>
                </div>

                <div class="flex items-center gap-2 flex-wrap">
                    <button onclick="openReceiptModal()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-cheese-400 border border-cheese-500/30 font-bold rounded-lg text-xs transition shadow-md">
                        📜 View Receipt (<span id="cart-count">0</span>)
                    </button>
                    <button onclick="resetGame()" class="px-3 py-1.5 bg-rose-950/80 hover:bg-rose-900 border border-rose-800 text-rose-300 font-bold rounded-lg text-xs transition">
                        🔄 Reset All
                    </button>
                </div>
            </div>

            <div class="bg-gradient-to-r from-emerald-950/80 via-slate-900 to-emerald-950/80 border border-emerald-500/30 rounded-2xl p-4 text-center shadow-inner relative overflow-hidden">
                <div class="text-xs font-semibold uppercase text-emerald-400 mb-1">Remaining Wealth</div>
                <div id="balance-display" class="text-3xl md:text-5xl font-black text-cheese-300 font-mono drop-shadow-[0_2px_10px_rgba(234,179,8,0.3)]">
                    0 🧀CX
                </div>
                <div class="mt-3 w-full bg-slate-950 rounded-full h-3.5 border border-slate-800 p-0.5 relative overflow-hidden">
                    <div id="progress-bar" class="bg-gradient-to-r from-cheese-500 via-amber-400 to-emerald-400 h-full rounded-full transition-all duration-300" style="width: 0%"></div>
                </div>
                <div class="flex justify-between text-[10px] text-slate-400 font-mono mt-1 px-1">
                    <span>Spent: <span id="spent-display" class="text-slate-200">0 🧀CX</span></span>
                    <span>Liquidated: <span id="percent-display" class="text-cheese-400 font-bold">0.00%</span></span>
                </div>
            </div>

            <div class="flex flex-wrap justify-between items-center gap-3 mt-3 pt-2 border-t border-slate-800/80">
                <div class="flex items-center gap-1">
                    <span class="text-xs font-bold text-slate-400 mr-1">BUY QTY:</span>
                    <button onclick="setMultiplier(1)" id="mult-1" class="mult-btn px-2 py-1 text-xs font-extrabold rounded-md border border-cheese-400 bg-cheese-400 text-slate-950">x1</button>
                    <button onclick="setMultiplier(10)" id="mult-10" class="mult-btn px-2 py-1 text-xs font-extrabold rounded-md border border-slate-700 bg-slate-800 text-slate-300">x10</button>
                    <button onclick="setMultiplier(100)" id="mult-100" class="mult-btn px-2 py-1 text-xs font-extrabold rounded-md border border-slate-700 bg-slate-800 text-slate-300">x100</button>
                    <button onclick="setMultiplier('MAX')" id="mult-MAX" class="mult-btn px-2 py-1 text-xs font-extrabold rounded-md border border-slate-700 bg-slate-800 text-slate-300">MAX</button>
                </div>

                <div class="flex items-center gap-2 flex-grow max-w-md">
                    <input type="text" id="search-input" oninput="renderItems()" placeholder="🔍 Search items..." class="w-full bg-slate-900 border border-slate-700 text-xs rounded-lg px-3 py-1.5 text-slate-200 outline-none">
                    <select id="category-select" onchange="renderItems()" class="bg-slate-900 border border-slate-700 text-xs text-slate-300 rounded-lg px-2 py-1.5 outline-none">
                        <option value="ALL">All Items</option>
                        <option value="Food">🍔 Food</option>
                        <option value="Game">🎮 Gaming</option>
                        <option value="Meme">🗿 Memes</option>
                        <option value="Flex">💎 Flex</option>
                        <option value="Cosmic">🌌 Cosmic</option>
                    </select>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8">
        <div id="items-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-3">
            <!-- Items populated by JS -->
        </div>
    </main>

    <!-- RECEIPT MODAL -->
    <div id="receipt-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
        <div class="glass-panel border border-slate-700 rounded-2xl p-6 max-w-lg w-full max-h-[85vh] flex flex-col shadow-2xl">
            <div class="flex justify-between items-center mb-4 border-b border-slate-800 pb-3">
                <h3 class="text-xl font-black text-cheese-400">📜 Official Receipt</h3>
                <button onclick="closeReceiptModal()" class="text-slate-400 hover:text-white text-lg font-bold">&times;</button>
            </div>
            <div id="receipt-content" class="overflow-y-auto flex-grow pr-2 font-mono text-xs space-y-2 text-slate-300 border-b border-slate-800 pb-4"></div>
            <div class="pt-4 flex justify-between items-center gap-2">
                <div class="text-xs text-slate-400">Total: <span id="receipt-total" class="text-cheese-400 font-bold">0 🧀CX</span></div>
                <button onclick="closeReceiptModal()" class="px-4 py-2 bg-cheese-500 hover:bg-cheese-400 text-slate-950 rounded-lg text-xs font-extrabold">Close</button>
            </div>
        </div>
    </div>

    <script>
        const PRESET_GUYS = [
            { id: 'bill', name: 'Bill Gates', worth: 100000000000, emoji: '👨‍💼', tagline: '"Tech pioneer turned philanthropist."' },
            { id: 'elon', name: 'Elon Musk', worth: 250000000000, emoji: '🚀', tagline: '"Sending Gouda cheese to Mars."' },
            { id: 'steve', name: 'Minecraft Steve', worth: 999000000000, emoji: '⛏️', tagline: '"Mined 64 stacks of Diamond Blocks."' },
            { id: 'noob', name: 'Roblox Noob', worth: 50000000000, emoji: '🟡', tagline: '"OOF! Spending Robux everywhere."' }
        ];

        // 200 Unique Items in a compact string to save space. Format: Name|Price|Category|Icon
        const rawItemData = `
Kraft Slice|1|Food|🧀
Dirt Block|2|Game|🟫
String Cheese|3|Food|🧀
Cup Noodles|5|Food|🍜
Wooden Pickaxe|8|Game|⛏️
Beijing Corn|10|Meme|🌽
Nasi Lemak|12|Food|🍛
Bloxy Cola|15|Game|🥤
Teh Tarik|18|Food|☕
Boba Tea|20|Food|🧋
OOF Button|25|Meme|🟥
Slipper|30|Meme|🩴
Pizza Slice|35|Food|🍕
Iron Sword|40|Game|🗡️
Command Block|50|Game|🎛️
Cheddar Block|65|Food|🧀
Timing God Medal|80|Game|⏱️
A+ Report Card|100|Meme|📝
GigaChad Jawline|120|Meme|🗿
Emotional Damage|150|Meme|💔
Fishing Rod|200|Game|🎣
Cheese Catcher|250|Game|🪤
Stickman Warrior|300|Game|🤺
Brie Wheel|400|Food|🧀
Gaming Mouse|500|Game|🖱️
Mechanical Keyboard|650|Game|⌨️
Gouda Shield|800|Game|🛡️
QR Code Generator|1000|Game|📱
Failure Management Book|1200|Meme|📚
Diamond Pickaxe|1500|Game|💎
Golden Apple|2000|Game|🍎
AirPods Pro|2500|Flex|🎧
End Crystal|3000|Game|🔮
Totem of Undying|4000|Game|🗿
iPad Pro|5000|Flex|📱
Gaming Chair|6500|Game|🪑
Robux Vault|8000|Game|💰
Cheese Font|10000|Meme|🧀
Truffle Fries|12000|Food|🍟
Wemmbu's PC|15000|Meme|💻
VR Headset|18000|Game|🥽
RTX 5090 GPU|25000|Game|🎛️
Rolex Watch|35000|Flex|⌚
Gold Cheese Knife|50000|Flex|🔪
Honda Civic|65000|Flex|🏎️
Arcade Cabinet|80000|Game|🕹️
Stick War Statue|100000|Game|🗿
Vintage Cheddar|120000|Food|🍷
Orbital Strike|150000|Meme|💥
Dominus Hat|200000|Game|🎩
Tesla Model 3|300000|Flex|🚗
Diamond Block|450000|Game|🧊
Hoverboard|600000|Flex|🛹
Lambo Huracan|800000|Flex|🏎️
KLCC Apartment|1000000|Flex|🏢
Roblox Studio HQ|1500000|Game|🏢
Cheese Museum|2500000|Flex|🏛️
Bugatti Chiron|4000000|Flex|🏎️
Golden Toilet|6000000|Meme|🚽
Private Jet|10000000|Flex|🛩️
Yacht|18000000|Flex|🛥️
T-Rex Fossil|25000000|Cosmic|🦖
Esports Arena|40000000|Game|🏟️
Tropical Island|65000000|Flex|🏝️
SpaceX Rocket|100000000|Cosmic|🚀
Mona Lisa|150000000|Flex|🖼️
Nuclear Sub|250000000|Flex|⚓
Cheese Satellite|400000000|Cosmic|🛰️
Burj Khalifa|650000000|Flex|🏙️
Antarctica Lab|1000000000|Cosmic|❄️
Moon Base|2000000000|Cosmic|🌕
Mars Colony|5000000000|Cosmic|🪐
Dyson Sphere|15000000000|Cosmic|☀️
Black Hole Battery|50000000000|Cosmic|🕳️
Warp Drive|100000000000|Cosmic|🌌
Cheese Multiverse|500000000000|Cosmic|✨`;

        // Parse string to items
        let items = rawItemData.trim().split('\n').map((line, index) => {
            let [name, price, category, icon] = line.split('|');
            return { id: index + 1, name, price: parseInt(price), category, icon, qty: 0 };
        });

        // Procedurally generate the remaining up to 200 using unique modifiers so they aren't repetitive
        const modifiers = ["Mega", "Ultra", "Quantum", "Cyber", "Neon", "Hyper", "Astral", "Void", "Cursed", "Blessed"];
        const baseNouns = ["Sword", "Shield", "Potion", "Engine", "Reactor", "Core", "Crown", "Throne", "Scepter", "Aura"];
        const cats = ["Game", "Flex", "Cosmic"];
        const icons = ["⚔️", "🛡️", "🧪", "⚙️", "☢️", "🌌", "👑", "🪑", "🪄", "✨"];
        
        let genPrice = 600000000000;
        while (items.length < 200) {
            let mod = modifiers[Math.floor(Math.random() * modifiers.length)];
            let noun = baseNouns[Math.floor(Math.random() * baseNouns.length)];
            let randIdx = Math.floor(Math.random() * cats.length);
            
            items.push({
                id: items.length + 1,
                name: `${mod} ${noun}`,
                price: genPrice,
                category: cats[randIdx],
                icon: icons[randIdx],
                qty: 0
            });
            genPrice = Math.floor(genPrice * 1.3);
        }

        let activeGuy = PRESET_GUYS[0];
        let activeMultiplier = 1;
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function playSound(type) {
            try {
                if (!audioCtx) audioCtx = new AudioCtx();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                const now = audioCtx.currentTime;
                if (type === 'buy') {
                    osc.frequency.setValueAtTime(500, now);
                    osc.frequency.exponentialRampToValueAtTime(800, now + 0.1);
                    gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                } else {
                    osc.frequency.setValueAtTime(800, now);
                    osc.frequency.exponentialRampToValueAtTime(400, now + 0.1);
                    gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                }
                osc.start(now); osc.stop(now + 0.1);
            } catch(e) {}
        }

        function init() {
            const select = document.getElementById('guy-select');
            PRESET_GUYS.forEach(guy => {
                const opt = document.createElement('option');
                opt.value = guy.id; opt.textContent = `${guy.name}`;
                select.appendChild(opt);
            });
            switchGuy('bill');
        }

        function switchGuy(guyId) {
            activeGuy = PRESET_GUYS.find(g => g.id === guyId) || PRESET_GUYS[0];
            items.forEach(i => i.qty = 0);
            document.getElementById('guy-emoji').textContent = activeGuy.emoji;
            document.getElementById('guy-tagline').textContent = activeGuy.tagline;
            updateUI();
        }

        function setMultiplier(val) {
            activeMultiplier = val;
            document.querySelectorAll('.mult-btn').forEach(btn => {
                btn.className = "mult-btn px-2 py-1 text-xs font-extrabold rounded-md border border-slate-700 bg-slate-800 text-slate-300";
            });
            document.getElementById(`mult-${val}`).className = "mult-btn px-2 py-1 text-xs font-extrabold rounded-md border border-cheese-400 bg-cheese-400 text-slate-950";
            renderItems();
        }

        function getSpent() { return items.reduce((sum, item) => sum + (item.price * item.qty), 0); }
        function getBal() { return activeGuy.worth - getSpent(); }
        function calcBuyQty(item) {
            if (activeMultiplier === 'MAX') return Math.max(1, Math.floor(getBal() / item.price));
            return activeMultiplier;
        }

        function buyItem(id) {
            const item = items.find(i => i.id === id);
            const qty = calcBuyQty(item);
            if (getBal() >= item.price * qty && qty > 0) {
                item.qty += qty;
                playSound('buy');
                updateUI();
            }
        }

        function sellItem(id) {
            const item = items.find(i => i.id === id);
            if (item.qty > 0) {
                const qty = activeMultiplier === 'MAX' ? item.qty : Math.min(item.qty, activeMultiplier);
                item.qty -= qty;
                playSound('sell');
                updateUI();
            }
        }

        function updateUI() {
            const spent = getSpent();
            const bal = getBal();
            const pct = Math.min(100, (spent / activeGuy.worth) * 100);

            document.getElementById('balance-display').textContent = `${bal.toLocaleString()} 🧀CX`;
            document.getElementById('spent-display').textContent = `${spent.toLocaleString()} 🧀CX`;
            document.getElementById('percent-display').textContent = `${pct.toFixed(2)}%`;
            document.getElementById('progress-bar').style.width = `${pct}%`;
            document.getElementById('cart-count').textContent = items.reduce((a, b) => a + b.qty, 0);

            renderItems();
        }

        function renderItems() {
            const grid = document.getElementById('items-grid');
            const search = document.getElementById('search-input').value.toLowerCase();
            const cat = document.getElementById('category-select').value;
            const bal = getBal();

            grid.innerHTML = items.filter(item => 
                item.name.toLowerCase().includes(search) && (cat === 'ALL' || item.category === cat)
            ).map(item => `
                <div class="glass-panel rounded-xl p-3 flex flex-col justify-between ${item.qty > 0 ? 'border-cheese-500/50 bg-slate-900/90' : ''}">
                    <div>
                        <div class="flex justify-between items-start mb-2">
                            <span class="text-2xl">${item.icon}</span>
                        </div>
                        <!-- NO LINE CLAMP, ALLOW TEXT TO WRAP -->
                        <h4 class="font-bold text-[13px] leading-tight text-slate-100 mb-1 break-words">${item.name}</h4>
                        <div class="text-cheese-400 font-bold font-mono text-xs">${item.price.toLocaleString()} CX</div>
                    </div>
                    <div class="mt-3 pt-2 border-t border-slate-800/80 flex flex-col gap-1">
                        <div class="flex gap-1">
                            <button onclick="sellItem(${item.id})" class="flex-1 py-1 bg-rose-950 text-rose-300 rounded text-[10px] font-bold ${item.qty <= 0 ? 'opacity-50 cursor-not-allowed' : ''}">Sell</button>
                            <button onclick="buyItem(${item.id})" class="flex-1 py-1 bg-emerald-500 text-slate-950 rounded text-[10px] font-extrabold ${bal < item.price ? 'opacity-50 cursor-not-allowed' : ''}">Buy</button>
                        </div>
                        <div class="text-center text-[10px] text-slate-400 font-mono mt-1">Owned: <span class="${item.qty > 0 ? 'text-cheese-400 font-bold' : ''}">${item.qty}</span></div>
                    </div>
                </div>
            `).join('');
        }

        function openReceiptModal() {
            const cont = document.getElementById('receipt-content');
            const bought = items.filter(i => i.qty > 0);
            cont.innerHTML = bought.length ? bought.map(i => `
                <div class="flex justify-between border-b border-slate-800/60 pb-1">
                    <span>${i.icon} ${i.name} x${i.qty}</span>
                    <span class="text-cheese-400">${(i.price * i.qty).toLocaleString()} CX</span>
                </div>
            `).join('') : '<div class="text-center text-slate-500">Cart empty!</div>';
            
            document.getElementById('receipt-total').textContent = `${getSpent().toLocaleString()} 🧀CX`;
            document.getElementById('receipt-modal').classList.remove('hidden');
        }

        function closeReceiptModal() { document.getElementById('receipt-modal').classList.add('hidden'); }
        function resetGame() { items.forEach(i => i.qty = 0); updateUI(); }

        window.onload = init;
    </script>
</body>
</html>
